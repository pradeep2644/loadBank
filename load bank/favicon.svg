<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Load Bank">
  <defs>
    <linearGradient id="cab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d5a78"/>
      <stop offset="100%" stop-color="#1a3350"/>
    </linearGradient>
    <linearGradient id="fin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc933"/>
      <stop offset="100%" stop-color="#e58a00"/>
    </linearGradient>
  </defs>
  <!-- cabinet shadow -->
  <rect x="5" y="7" width="22" height="22" rx="2" fill="#0c2340" opacity="0.35"/>
  <!-- main cabinet -->
  <rect x="4" y="6" width="22" height="22" rx="2" fill="url(#cab)" stroke="#ffb800" stroke-width="0.8"/>
  <!-- top control panel -->
  <rect x="6" y="8" width="18" height="5" rx="1" fill="#0c2340" stroke="#5a7894" stroke-width="0.5"/>
  <!-- LCD display -->
  <rect x="8" y="9.2" width="10" height="2.6" rx="0.4" fill="#001f3d" stroke="#00a896" stroke-width="0.35"/>
  <rect x="8.8" y="10" width="1.2" height="1" fill="#ffb800"/>
  <rect x="10.4" y="10" width="1.2" height="1" fill="#ffb800"/>
  <rect x="12" y="10" width="1.2" height="1" fill="#ffb800" opacity="0.5"/>
  <rect x="13.6" y="10" width="1.2" height="1" fill="#ffb800" opacity="0.35"/>
  <!-- status LEDs -->
  <circle cx="20" cy="10.5" r="0.7" fill="#25d366"/>
  <circle cx="22" cy="10.5" r="0.7" fill="#ffb800"/>
  <!-- resistor bank fins -->
  <g fill="url(#fin)">
    <rect x="7" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="9.4" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="11.8" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="14.2" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="16.6" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="19" y="15" width="1.6" height="9" rx="0.3"/>
    <rect x="21.4" y="15" width="1.6" height="9" rx="0.3"/>
  </g>
  <!-- fin heat glow -->
  <rect x="7" y="15" width="16" height="9" rx="0.3" fill="#ffb800" opacity="0.08"/>
  <!-- bottom vent grille -->
  <rect x="7" y="24.5" width="16" height="2.5" rx="0.4" fill="#0c2340"/>
  <line x1="8" y1="25.3" x2="22" y2="25.3" stroke="#5a7894" stroke-width="0.45"/>
  <line x1="8" y1="26.2" x2="22" y2="26.2" stroke="#5a7894" stroke-width="0.45"/>
  <!-- side terminal lugs -->
  <rect x="2.5" y="14" width="1.5" height="3" rx="0.3" fill="#c0c8d0"/>
  <rect x="2.5" y="18.5" width="1.5" height="3" rx="0.3" fill="#c0c8d0"/>
  <rect x="28" y="14" width="1.5" height="3" rx="0.3" fill="#c0c8d0"/>
  <rect x="28" y="18.5" width="1.5" height="3" rx="0.3" fill="#c0c8d0"/>
  <!-- wheels -->
  <circle cx="8" cy="29" r="1.1" fill="#2a4a68" stroke="#5a7894" stroke-width="0.4"/>
  <circle cx="22" cy="29" r="1.1" fill="#2a4a68" stroke="#5a7894" stroke-width="0.4"/>
</svg>
